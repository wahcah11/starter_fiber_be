services:
  app:
    image: my-go-starter-img
    pull_policy: never
    container_name: starter_app
    command: sleep infinity
    volumes:
      - ../:/app:Z
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=starter_user
      - DB_PASSWORD=starter_pass        # ← fix: DB_PASS → DB_PASSWORD
      - DB_NAME=starter_db
      - APP_PORT=8080
      - APP_ENV=development
      - APP_NAME=starter-wahcah-be
      - JWT_SECRET=change_this_secret_in_prod
      - JWT_EXPIRES_IN=24h
      - ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "9090:8080"
    depends_on:
      db:
        condition: service_healthy    # ← tunggu DB benar-benar ready
    networks:
      - starter-network

  db:
    image: mysql:8.0
    container_name: starter_db
    environment:
      MYSQL_DATABASE: starter_db
      MYSQL_USER: starter_user
      MYSQL_PASSWORD: starter_pass
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_starter_data:/var/lib/mysql:Z
    healthcheck:                        # ← tambah healthcheck agar app tidak konek sebelum DB ready
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "starter_user", "-pstarter_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - starter-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: starter_pma
    ports:
      - "9091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - starter-network

volumes:
  mysql_starter_data:
    driver: local

networks:
  starter-network:
    driver: bridge